---
layout: default
---
{% include demo-banner.html %}

<article class="note-page">
  <header class="note-page__header">
    <p class="note-page__kicker">Poznámka{% if page.number %} #{{ page.number }}{% endif %}</p>
    <h1 class="note-page__title">{{ page.title }}</h1>
    <p class="note-page__meta">
      {% include date.html date=page.date %}
      <span aria-hidden="true"> · </span>
      <span>{% include reading-time.html %}</span>
    </p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
